name: Deploy

# 只在「推送到 main 分支」时触发自动部署;也支持在 Actions 页面手动点击触发
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: key-manager-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 拉取待部署代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 在 runner 安装依赖并验证构建
        run: |
          pnpm install --frozen-lockfile --prod=false
          pnpm check
          pnpm test
          pnpm build
          tar -czf key-manager-build.tgz dist
          sha256sum key-manager-build.tgz > key-manager-build.tgz.sha256

      # SSH 步骤失败时 appleboy 的报错很含糊,而完整 job 日志要 repo admin 权限才看得到,
      # 所以先在这里自检一遍:哪个 Secret 空了、私钥格式对不对、端口通不通。
      # 只打印名字、长度和判定结果,不打印任何 Secret 的值。
      - name: 自检 Secrets 与连通性
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CONTRACT_BASE_URL: ${{ secrets.FEISHU_CONTRACT_BASE_URL }}
          FEISHU_KEY_REQUEST_WEBHOOK_URL: ${{ secrets.FEISHU_KEY_REQUEST_WEBHOOK_URL }}
          FEISHU_APPROVAL_CHAT_ID: ${{ secrets.FEISHU_APPROVAL_CHAT_ID }}
          FEISHU_VERIFICATION_TOKEN: ${{ secrets.FEISHU_VERIFICATION_TOKEN }}
          FEISHU_CALLBACK_ENCRYPT_KEY: ${{ secrets.FEISHU_CALLBACK_ENCRYPT_KEY }}
          FEISHU_APPROVAL_REVIEWER_USERNAME: ${{ secrets.FEISHU_APPROVAL_REVIEWER_USERNAME }}
        run: |
          fatal=0

          report() {
            # $1=名称 $2=值 $3=required|optional
            if [ -z "$2" ]; then
              if [ "$3" = required ]; then
                echo "  ✗ $1 未设置或为空"
                fatal=1
              else
                echo "  · $1 未设置(可选,保留服务器已有配置)"
              fi
            else
              echo "  ✓ $1 已设置(${#2} 字符)"
            fi
          }

          echo "== 登录用 Secrets(缺一不可) =="
          report SERVER_HOST "$SERVER_HOST" required
          report SERVER_PORT "$SERVER_PORT" required
          report SERVER_USER "$SERVER_USER" required
          report SERVER_SSH_KEY "$SERVER_SSH_KEY" required

          echo "== 运行时 Secrets =="
          report DATABASE_URL "$DATABASE_URL" required
          report JWT_SECRET "$JWT_SECRET" required
          for name in FEISHU_APP_ID FEISHU_APP_SECRET FEISHU_CONTRACT_BASE_URL \
                      FEISHU_KEY_REQUEST_WEBHOOK_URL FEISHU_APPROVAL_CHAT_ID \
                      FEISHU_VERIFICATION_TOKEN FEISHU_CALLBACK_ENCRYPT_KEY \
                      FEISHU_APPROVAL_REVIEWER_USERNAME; do
            eval "value=\${$name}"
            report "$name" "$value" optional
          done

          echo "== SERVER_PORT 格式 =="
          case "$SERVER_PORT" in
            '') ;;
            *[!0-9]*) echo "  ✗ 不是纯数字(有空格或换行也会这样)"; fatal=1 ;;
            *) echo "  ✓ 纯数字" ;;
          esac

          echo "== SERVER_SSH_KEY 格式 =="
          if [ -n "$SERVER_SSH_KEY" ]; then
            # 用 case 匹配,避免把私钥内容 echo 出来
            case "$SERVER_SSH_KEY" in
              "-----BEGIN "*)
                echo "  ✓ 以 -----BEGIN 开头" ;;
              "ssh-rsa "*|"ssh-ed25519 "*|"ecdsa-sha2-"*)
                echo "  ✗ 这是公钥(.pub)。这里要填私钥全文,公钥是放到服务器 ~/.ssh/authorized_keys 的"
                fatal=1 ;;
              *)
                echo "  ✗ 开头不是 -----BEGIN,可能贴错内容或有前导空白/引号"
                fatal=1 ;;
            esac
            lines=$(printf '%s\n' "$SERVER_SSH_KEY" | wc -l)
            if [ "$lines" -lt 3 ]; then
              echo "  ✗ 只有 $lines 行 —— 私钥被压成单行了,粘贴时必须保留原始换行"
              fatal=1
            else
              echo "  ✓ $lines 行"
            fi
            case "$SERVER_SSH_KEY" in
              *"PRIVATE KEY"*) echo "  ✓ 含 PRIVATE KEY 标记" ;;
              *) echo "  ✗ 不含 PRIVATE KEY 标记"; fatal=1 ;;
            esac
          fi

          verdict=""

          echo "== TCP 连通性 =="
          tcp=unknown
          if [ -n "$SERVER_HOST" ] && [ -n "$SERVER_PORT" ]; then
            if timeout 15 bash -c "cat < /dev/null > /dev/tcp/$SERVER_HOST/$SERVER_PORT" 2>/dev/null; then
              tcp=ok;   echo "  ✓ 端口可达"
            else
              tcp=fail; fatal=1
              echo "  ✗ 连不上(拒绝或超时)——HOST/PORT 指错机器,或 sshd 没起,或安全组挡了"
            fi
          fi
          verdict="TCP=$tcp"

          # 亲自连一次并保留 ssh -v 的判定,好把结论写进 annotation。
          # appleboy 也是这么落盘私钥的;这里 umask 077 + trap 清理,且全程不打印私钥内容。
          echo "== SSH 握手 =="
          if [ "$fatal" = 0 ] && [ "$tcp" = ok ]; then
            keyfile="${RUNNER_TEMP:-/tmp}/deploy_probe_key"
            trap 'rm -f "$keyfile"' EXIT
            (umask 077; printf '%s\n' "$SERVER_SSH_KEY" > "$keyfile")
            if sshout=$(ssh -v -i "$keyfile" \
                            -o BatchMode=yes \
                            -o StrictHostKeyChecking=no \
                            -o UserKnownHostsFile=/dev/null \
                            -o ConnectTimeout=10 \
                            -o NumberOfPasswordPrompts=0 \
                            -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
                            'echo PROBE_OK' 2>&1); then
              echo "  ✓ 登录成功"
              verdict="$verdict SSH=ok"
            else
              # 丢掉 debug 噪音,只留判定性的那几行,不回显整段 -v 输出
              real=$(printf '%s\n' "$sshout" | grep -v '^debug')
              reason=$(printf '%s\n' "$real" | grep -Ei \
                'permission denied|invalid format|error in libcrypto|bad permissions|not accessible|refused|timed out|closed by|too many|unable to negotiate|no matching|verification failed|load key' \
                | head -3 | tr '\n' ';')
              [ -n "$reason" ] || reason=$(printf '%s\n' "$real" | grep -v '^$' | tail -2 | tr '\n' ';')
              echo "  ✗ 登录失败:$reason"
              verdict="$verdict SSH=fail 原因:$reason"
              fatal=1
            fi
            rm -f "$keyfile"; trap - EXIT
          else
            echo "  - 跳过(前置检查未通过或端口不通)"
          fi

          if [ "$fatal" = 1 ]; then
            echo ""
            echo "$verdict"
            # 写成 annotation,这样在 Actions 首页的 Annotations 区就能直接看到结论
            echo "::error title=部署自检失败::$verdict"
            exit 1
          fi
          echo ""
          echo "自检通过($verdict)。"

      - name: 服务器资源预检
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            cd /opt/key-manager
            disk_kb=$(df -Pk . | awk 'NR == 2 { print $4 }')
            free_inodes=$(df -Pi . | awk 'NR == 2 { print $4 }')
            available_kb=$(awk '/^MemAvailable:/ { print $2 }' /proc/meminfo)
            echo "可用磁盘 $((disk_kb / 1024)) MiB；可用内存 $((available_kb / 1024)) MiB；剩余 inode $free_inodes"
            [ "$disk_kb" -ge 2097152 ] || { echo "磁盘剩余不足 2 GiB，停止部署。"; exit 1; }
            [ "$free_inodes" -ge 50000 ] || { echo "剩余 inode 不足 50000，停止部署。"; exit 1; }
            [ "$available_kb" -ge 262144 ] || { echo "可用内存不足 256 MiB，停止部署。"; exit 1; }
            command -v flock >/dev/null

      - name: 上传预构建产物
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: key-manager-build.tgz,key-manager-build.tgz.sha256,scripts/deploy-maintenance.mjs
          target: /opt/key-manager-deployments/${{ github.run_id }}-${{ github.run_attempt }}

      - name: SSH 登录服务器并部署
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -eu
            export PATH=$PATH:/usr/local/bin:/usr/bin
            export NODE_ENV=production
            cd /opt/key-manager
            DEPLOY_ROOT=/opt/key-manager-deployments
            DEPLOY_INPUT=$DEPLOY_ROOT/${{ github.run_id }}-${{ github.run_attempt }}
            MAINTENANCE=$DEPLOY_INPUT/scripts/deploy-maintenance.mjs
            exec 9>"$DEPLOY_ROOT/.deploy.lock"
            flock -n 9 || { echo "已有部署任务运行，停止本次部署。"; exit 1; }
            node "$MAINTENANCE" record "$DEPLOY_ROOT" "$DEPLOY_INPUT" prepared
            finish_deployment() {
              result=$?
              trap - EXIT
              if [ "$result" -ne 0 ]; then
                node "$MAINTENANCE" record "$DEPLOY_ROOT" "$DEPLOY_INPUT" failed || true
              fi
              node "$MAINTENANCE" cleanup "$DEPLOY_ROOT" "$DEPLOY_INPUT" || echo "历史产物清理未完成，下次部署重试。"
              flock -u 9
              exit "$result"
            }
            trap finish_deployment EXIT
            node "$MAINTENANCE" cleanup "$DEPLOY_ROOT" "$DEPLOY_INPUT"
            echo "==> 校验并解包预构建产物"
            (cd "$DEPLOY_INPUT" && sha256sum -c key-manager-build.tgz.sha256)
            mkdir -p "$DEPLOY_INPUT/staging"
            tar -xzf "$DEPLOY_INPUT/key-manager-build.tgz" -C "$DEPLOY_INPUT/staging"
            test -s "$DEPLOY_INPUT/staging/dist/index.js"
            test -s "$DEPLOY_INPUT/staging/dist/public/index.html"
            echo "==> 拉取最新代码"
            # 限制拉取耗时，网络异常时保留运行中的版本。
            ok=0
            for i in 1 2 3; do
              if timeout 60s git fetch origin ${{ github.sha }}; then ok=1; break; fi
              echo "fetch 第 $i 次失败,5 秒后重试..."
              sleep 5
            done
            [ "$ok" = 1 ] || { echo "拉取代码多次失败,放弃"; exit 1; }
            # 与 runner 构建的提交保持一致，避免排队部署时取到更新的 main。
            git reset --hard ${{ github.sha }}
            echo "==> 检查公司系统包签名密钥"
            SIGNING_KEY_PATH=/opt/key-manager-secrets/system-package-private.pem
            FRONTEND_RELEASE_DIR=/data/html
            mkdir -p "$FRONTEND_RELEASE_DIR"
            if [ ! -r "$SIGNING_KEY_PATH" ]; then
              echo "公司系统包签名密钥不可读取：$SIGNING_KEY_PATH。请先在服务器安全部署与桌面端公钥配对的私钥。"
              exit 1
            fi
            if [ ! -f .env ]; then
            echo "==> 首次创建 .env 配置(从 GitHub Secrets)"
            umask 077
            cat > "$DEPLOY_INPUT/bootstrap.env" <<EOF
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            PORT=3000
            # 生成密钥是否强制绑定合同,默认不强制(空值即不强制)。
            # 需要恢复"必须绑合同"就把 Secret KEY_REQUIRE_CONTRACT 设为 true。
            KEY_REQUIRE_CONTRACT=${{ secrets.KEY_REQUIRE_CONTRACT }}
            FEISHU_CONTRACTS_ENABLED=true
            FEISHU_APP_ID=${{ secrets.FEISHU_APP_ID }}
            FEISHU_APP_SECRET=${{ secrets.FEISHU_APP_SECRET }}
            FEISHU_CONTRACT_BASE_URL=${{ secrets.FEISHU_CONTRACT_BASE_URL }}
            FEISHU_KEY_REQUEST_WEBHOOK_URL=${{ secrets.FEISHU_KEY_REQUEST_WEBHOOK_URL }}
            FEISHU_APPROVAL_CHAT_ID=${{ secrets.FEISHU_APPROVAL_CHAT_ID }}
            FEISHU_VERIFICATION_TOKEN=${{ secrets.FEISHU_VERIFICATION_TOKEN }}
            FEISHU_CALLBACK_ENCRYPT_KEY=${{ secrets.FEISHU_CALLBACK_ENCRYPT_KEY }}
            FEISHU_APPROVAL_REVIEWER_USERNAME=${{ secrets.FEISHU_APPROVAL_REVIEWER_USERNAME }}
            SHROOM_SYSTEM_PACKAGE_SIGNING_KEY_PATH=$SIGNING_KEY_PATH
            SHROOM_FRONTEND_RELEASE_DIR=$FRONTEND_RELEASE_DIR
            EOF
            mv "$DEPLOY_INPUT/bootstrap.env" .env
            else
              echo "==> 保留服务器现有 .env 配置"
            fi
            echo "==> 安装依赖"
            # 迁移需要 drizzle-kit；同一 Node 版本及依赖输入复用安装结果。
            dependency_hash=$(node "$MAINTENANCE" fingerprint "$PWD")
            dependency_marker=$DEPLOY_ROOT/dependencies.sha256
            if [ -f "$dependency_marker" ] && [ -f node_modules/.modules.yaml ] && [ -f node_modules/drizzle-kit/bin.cjs ] && [ "$(cat "$dependency_marker")" = "$dependency_hash" ]; then
              echo "依赖未变化，跳过安装。"
            else
              timeout 180s env NODE_OPTIONS="${NODE_OPTIONS:-} --max-old-space-size=384" pnpm install --frozen-lockfile --prod=false --network-concurrency=4 --child-concurrency=1
              printf '%s\n' "$dependency_hash" > "$dependency_marker"
            fi
            echo "==> 应用数据库迁移(仅应用已提交的迁移,不在服务器上重新生成,避免漂移导致重复建表失败)"
            # 表结构以已提交的迁移为准;新增表(如 deviceCodeRecords)由服务启动时的 ensure* 幂等自愈
            timeout 120s env NODE_OPTIONS="${NODE_OPTIONS:-} --max-old-space-size=384" pnpm db:migrate
            echo "==> 切换预构建产物"
            HAD_PREVIOUS=0
            if [ -d dist ]; then
              mv dist "$DEPLOY_INPUT/previous-dist"
              HAD_PREVIOUS=1
            fi
            if ! mv "$DEPLOY_INPUT/staging/dist" dist; then
              if [ "$HAD_PREVIOUS" = 1 ]; then
                mv "$DEPLOY_INPUT/previous-dist" dist
              fi
              exit 1
            fi
            echo "==> 重启并检查服务"
            healthy=0
            consecutive=0
            if SHROOM_SYSTEM_PACKAGE_SIGNING_KEY_PATH="$SIGNING_KEY_PATH" SHROOM_FRONTEND_RELEASE_DIR="$FRONTEND_RELEASE_DIR" pm2 restart key-manager --update-env; then
              for i in $(seq 1 15); do
                if curl -fsS --max-time 3 http://127.0.0.1:3000/ -o "$DEPLOY_INPUT/health-index.html" && cmp -s "$DEPLOY_INPUT/health-index.html" dist/public/index.html; then
                  consecutive=$((consecutive + 1))
                  if [ "$consecutive" -ge 3 ]; then
                    healthy=1
                    break
                  fi
                else
                  consecutive=0
                fi
                sleep 2
              done
            fi
            if [ "$healthy" != 1 ]; then
              echo "服务健康检查失败，保留失败产物并恢复上一版 dist。"
              if [ "$HAD_PREVIOUS" = 1 ]; then
                mv dist "$DEPLOY_INPUT/failed-dist"
                mv "$DEPLOY_INPUT/previous-dist" dist
                pm2 restart key-manager --update-env || true
              fi
              exit 1
            fi
            pm2 save
            node "$MAINTENANCE" record "$DEPLOY_ROOT" "$DEPLOY_INPUT" success
            echo "==> 部署完成"
